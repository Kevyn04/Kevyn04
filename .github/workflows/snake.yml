name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
                    outputs: |
            dist/github-snake-red.svg?color_snake=#DC2626&color_dots=#FFE5E5,#FECACA,#FCA5A5,#EF4444,#B91C1C
            dist/github-snake-red-dark.svg?palette=github-dark&color_snake=#EF4444&color_dots=#2A1518,#7F1D1D,#B91C1C,#DC2626,#EF4444

      - name: Publish images
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
