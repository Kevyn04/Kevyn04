name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kevyn04
                   outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23DC2626
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23EF4444

      - name: Publish images
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
